<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>متجرك السحابي | Cloud Store</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- الهيدر -->
  <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-50">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <h1 class="text-xl font-black text-white tracking-wider">⚡ متجري السحابي</h1>
      <button onclick="openAdmin()" class="bg-slate-800 hover:bg-slate-700 text-xs font-bold px-4 py-2 rounded-lg border border-slate-700 transition">
        <i class="fa-solid fa-gear ml-1"></i> لوحة التحكم
      </button>
    </div>
  </header>

  <!-- محتوى المنتجات -->
  <main class="flex-grow max-w-6xl mx-auto px-4 py-8 w-full">
    <h2 class="text-2xl font-black mb-6 border-b border-slate-800 pb-2">المنتجات المتاحة</h2>
    <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      <!-- المنتجات تظهر هنا تلقائياً -->
    </div>
  </main>

  <!-- لوحة التحكم (إضافة منتج) -->
  <div id="admin-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 w-full max-w-lg rounded-2xl p-6 relative shadow-2xl">
      <button onclick="closeAdmin()" class="absolute top-4 left-4 text-slate-400 hover:text-white text-lg"><i class="fa-solid fa-xmark"></i></button>
      <h3 class="text-lg font-black mb-4 text-white">إضافة منتج جديد برفع مباشر</h3>
      
      <form onsubmit="handleImageAndAddProduct(event)" class="space-y-4 text-xs">
        <div>
          <label class="block text-slate-400 mb-1 font-bold">اسم المنتج</label>
          <input type="text" id="p-name" class="w-full bg-slate-950 border border-slate-800 p-3 rounded-lg text-white" required>
        </div>
        <div>
          <label class="block text-slate-400 mb-1 font-bold">السعر (جنيه)</label>
          <input type="number" id="p-price" class="w-full bg-slate-950 border border-slate-800 p-3 rounded-lg text-white" required>
        </div>
        <div>
          <label class="block text-slate-400 mb-1 font-bold">صورة المنتج من جهازك (ترفع تلقائياً للسحابة)</label>
          <input type="file" id="p-file" accept="image/*" class="w-full bg-slate-950 border border-slate-800 p-2 rounded-lg text-white file:bg-indigo-600 file:text-white file:border-0 file:rounded file:px-3 file:py-1 file:cursor-pointer" required>
        </div>
        <button type="submit" id="submit-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-lg transition text-sm">
          رفع الصورة وحفظ المنتج
        </button>
      </form>
    </div>
  </div>

  <script>
    // بيانات سحابية جاهزة للتجربة الفورية (Cloudinary Preset عام ومجاني للاختبار)
    const CLOUD_NAME = "demo"; // يمكنك استبداله بحسابك المجاني لاحقاً على Cloudinary
    const UPLOAD_PRESET = "docs_unsigned_upload"; // بريسيت افتتاحي للرفع السريع

    let products = JSON.parse(localStorage.getItem('cloud_store_products')) || [];

    function renderProducts() {
      const grid = document.getElementById('products-grid');
      grid.innerHTML = '';
      if (products.length === 0) {
        grid.innerHTML = '<p class="text-slate-500 col-span-full text-center py-10">لا توجد منتجات. افتح لوحة التحكم وأضف أول منتج!</p>';
        return;
      }
      products.forEach(p => {
        grid.innerHTML += `
          <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-lg flex flex-col">
            <img src="${p.image}" class="w-full h-48 object-cover">
            <div class="p-4 flex flex-col flex-grow justify-between">
              <div>
                <h3 class="font-bold text-white text-base mb-1">${p.name}</h3>
                <span class="text-indigo-400 font-black text-sm">${p.price} EGP</span>
              </div>
            </div>
          </div>
        `;
      });
    }

    async function handleImageAndAddProduct(e) {
      e.preventDefault();
      const name = document.getElementById('p-name').value;
      const price = document.getElementById('p-price').value;
      const fileInput = document.getElementById('p-file');
      const btn = document.getElementById('submit-btn');

      if (!fileInput.files[0]) return alert('يرجى اختيار صورة!');

      btn.innerText = "جاري رفع الصورة للسحابة... ⏳";
      btn.disabled = true;

      const formData = new FormData();
      formData.append("file", fileInput.files[0]);
      formData.append("upload_preset", UPLOAD_PRESET);

      try {
        // الخطوة السحرية: إرسال الصورة مباشرة لسيرفر سحابي خارجي للحصول على رابط ثابت
        const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, {
          method: "POST",
          body: formData
        });
        const data = await response.json();

        if (data.secure_url) {
          const imageUrl = data.secure_url; // هذا هو الرابط السحابي الثابت والصحيح

          // حفظ المنتج مع الرابط
          products.push({ id: Date.now(), name, price, image: imageUrl });
          localStorage.setItem('cloud_store_products', JSON.stringify(products));

          renderProducts();
          closeAdmin();
          e.target.reset();
          alert('تم رفع الصورة وحفظ المنتج بنجاح يا غالي! 🚀');
        } else {
          throw new Error('فشل الرفع');
        }
      } catch (error) {
        alert('حدث خطأ أثناء رفع الصورة، تأكد من اتصال الإنترنت.');
      } finally {
        btn.innerText = "رفع الصورة وحفظ المنتج";
        btn.disabled = false;
      }
    }

    function openAdmin() { document.getElementById('admin-modal').classList.remove('hidden'); }
    function closeAdmin() { document.getElementById('admin-modal').classList.add('hidden'); }

    renderProducts();
  </script>
</body>
</html>
